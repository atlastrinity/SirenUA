name: SirenUA
options:
  bundleIdPrefix: com.sirenua
targets:
  SirenUA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: Sources/SirenUA
    settings:
      base:
        INFOPLIST_FILE: Sources/SirenUA/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sirenua.SirenUA
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SirenUATests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: Tests/SirenUATests
    dependencies:
      - target: SirenUA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SirenUA:
    build:
      targets:
        SirenUA: all
    run:
      config: Debug
      storeKitConfiguration: SirenUA.storekit
